spring.application.name=supply-chain-engine

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/supply_chain_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework.security=INFO

# Google Gemini AI
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite